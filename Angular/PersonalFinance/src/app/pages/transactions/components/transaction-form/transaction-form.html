<div class="tx-form-drawer" [class.tx-form-drawer--open]="isOpen()">
  <div class="tx-form-drawer__inner">
    <div class="tx-form-card">
      <div class="tx-form-card__header">
        <h3 class="tx-form-card__title">
          {{ editingId() ? 'Editar Lançamento' : 'Registro Rápido' }}
        </h3>
        <p class="tx-form-card__subtitle">Insira ou modifique uma movimentação instantaneamente.</p>
      </div>
      
      <form [formGroup]="transactionForm()" (ngSubmit)="onSave()" class="tx-form">
        <div class="tx-form__field">
          <label class="tx-form__label">Título do Lançamento</label>
          <input formControlName="title" class="tx-form__input" placeholder="Ex: Assinatura Netflix" type="text" />
        </div>
        
        <div class="tx-form__grid">
          <div class="tx-form__field">
            <label class="tx-form__label">Valor</label>
            <input 
              formControlName="amount" 
              appCurrencyMask
              class="tx-form__input tx-form__input--large" 
              placeholder="0,00" 
              type="text" />
          </div>

          <app-select-field
            fieldId="type"
            label="Tipo"
            [options]="typeOptions"
            placeholder="Selecione um tipo"
            formControlName="type">
          </app-select-field>
          
          <app-select-field
            fieldId="categoryId"
            label="Categoria"
            [options]="categoryOptions()"
            placeholder="Selecione uma categoria"
            formControlName="categoryId">
          </app-select-field>

          <div class="tx-form__field">
            <label class="tx-form__label">Data do Fluxo</label>
            <input formControlName="date" class="tx-form__input" type="date" />
          </div>

          <div class="tx-form__field">
            <label class="tx-form__label">Status</label>
            <div class="tx-form__select-wrapper">
              <select formControlName="status" class="tx-form__select">
                <option value="Confirmado">Confirmado</option>
                <option value="Agendado">Agendado</option>
                <option value="Débito">Débito</option>
              </select>
              <span class="material-symbols-outlined tx-form__select-icon">expand_more</span>
            </div>
          </div>
        </div>

        <div class="tx-form__recurrent-toggle">
          <label class="tx-form__checkbox-label">
            <input type="checkbox" formControlName="isRecurrent" class="tx-form__checkbox" />
            <span class="tx-form__checkbox-text">Transação Recorrente</span>
          </label>
        </div>

        <div class="tx-form__recurrent-fields" [class.tx-form__recurrent-fields--open]="transactionForm().get('isRecurrent')?.value" formGroupName="recurrent">
          <div>
            <div class="tx-form__grid" style="padding-top: 16px;">
              <div class="tx-form__field">
                <label class="tx-form__label">Frequência</label>
                <div class="tx-form__select-wrapper">
                  <select formControlName="period" class="tx-form__select">
                    <option value="Daily">Diário</option>
                    <option value="Weekly">Semanal</option>
                    <option value="Monthly">Mensal</option>
                    <option value="Yearly">Anual</option>
                  </select>
                  <span class="material-symbols-outlined tx-form__select-icon">expand_more</span>
                </div>
              </div>

              <div class="tx-form__field">
                <label class="tx-form__label">Data Fim (Opcional)</label>
                <input formControlName="endDate" class="tx-form__input" type="date" />
              </div>
            </div>
          </div>
        </div>
        
        <div class="tx-form__actions">
          <button type="button" class="tx-form__btn tx-form__btn--cancel" (click)="onCancel()">Cancelar</button>
          <button type="submit" [disabled]="transactionForm().invalid" class="tx-form__btn tx-form__btn--save">Salvar Lançamento</button>
        </div>
      </form>
    </div>
  </div>
</div>

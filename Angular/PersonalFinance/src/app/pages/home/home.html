<div class="home-layout">
  <!-- ① Sidebar -->
  <app-sidebar
    (investClick)="onInvest()"
    (logoutClick)="onLogout()"
  ></app-sidebar>

  <!-- ② Main Content -->
  <main class="home-layout__main">
    <!-- ③ Sticky Top Bar -->
    <app-header></app-header>

    <!-- ④ Scrollable Dashboard Content -->
    <div class="home-layout__content">

      <!-- SECTION 1: Hero Balance + Projection -->
      <section class="home-layout__hero-row">
        <div class="home-layout__hero-balance">
          <app-balance-card></app-balance-card>
        </div>
        <div class="home-layout__hero-projection">
          <app-projection-card></app-projection-card>
        </div>
      </section>

      <!-- SECTION 2: Analytics Row -->
      <section class="home-layout__analytics-row">
        <div class="home-layout__cash-flow">
          <app-cash-flow-card></app-cash-flow-card>
        </div>
        <div class="home-layout__category">
          <app-category-chart-card></app-category-chart-card>
        </div>
      </section>

      <!-- SECTION 3: Transactions -->
      <section class="home-layout__transactions">
        <app-transactions-card></app-transactions-card>
      </section>

    </div><!-- /.home-layout__content -->
  </main><!-- /.home-layout__main -->

  <!-- ⑤ Floating Action Button -->
  <button
    class="home-layout__fab"
    aria-label="Nova Transação"
    (click)="onNewTransaction()"
  >
    <span class="material-symbols-outlined home-layout__fab-icon">add</span>
    <span class="home-layout__fab-tooltip">Nova Transação</span>
  </button>
</div>

<div class="card">
  <div class="card__header">
    <div class="card__title-group">
      <div class="card__icon-wrap">
        <span class="material-symbols-outlined">trending_up</span>
      </div>
      <h3 class="card__title">Projeção Próximo Mês</h3>
    </div>
  </div>
  <div class="card__body">
    <p class="card__value">
      {{ projection().projectedBalance | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
    </p>
    <p class="card__description">{{ projection().description }}</p>

<div class="projection-card">
  <div class="projection-card__body">
    <p class="projection-card__label">Projeção Próximo Mês</p>
    <p class="projection-card__value">
      {{ projection().projectedBalance | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
    </p>
    <p class="projection-card__description">{{ projection().description }}</p>
  </div>

  <!-- Emergency Fund Progress -->
  <div class="projection-card__goal">
    <div class="projection-card__goal-header">
      <span class="projection-card__goal-label">Meta de Reserva de Emergência</span>
      <span class="projection-card__goal-percent">{{ projection().emergencyGoalPercent }}%</span>
    </div>
    <div class="projection-card__progress-track">
      <div
        class="projection-card__progress-fill"
        [style.width.%]="projection().emergencyGoalPercent"
        role="progressbar"
        [attr.aria-valuenow]="projection().emergencyGoalPercent"
        aria-valuemin="0"
        aria-valuemax="100"
      ></div>
    </div>
  </div>
</div>

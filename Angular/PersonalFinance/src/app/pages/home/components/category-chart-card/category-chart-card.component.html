<div class="card">
  <!-- Card Header -->
  <div class="card__header">
    <div class="card__title-group">
      <div class="card__icon-wrap">
        <span class="material-symbols-outlined">pie_chart</span>
      </div>
      <h3 class="card__title">Gastos por Categoria</h3>
    </div>
    <span class="card__month">{{ spending().month }}</span>
  </div>

  <div class="card__body">
    <!-- Donut Chart -->
    <div class="card__chart-area">
      <div class="card__donut" [style.background]="donutGradient" role="img"
        aria-label="Gráfico de gastos por categoria">
        <div class="card__donut-hole"></div>
        <div class="card__donut-center">
          <p class="card__donut-sub">Total Gasto</p>
          <p class="card__donut-value">
            R$ {{ spending().totalSpent | number:'1.0-0':'pt-BR' }}
          </p>
        </div>
      </div>
    </div>

    <!-- Legend -->
    <div class="card__legend">
      @for (cat of spending().categories; track cat.label) {
      <div class="card__legend-item">
        <span class="card__legend-dot" [style.background]="cat.colorVar"></span>
        <div class="card__legend-text">
          <span class="card__legend-label">{{ cat.label }}</span>
          <span class="card__legend-percent">R$ {{ cat.value | number:'1.0-0':'pt-BR' }} ({{ cat.percent
            }}%)</span>
        </div>
      </div>
      }
    </div>
  </div>
</div>

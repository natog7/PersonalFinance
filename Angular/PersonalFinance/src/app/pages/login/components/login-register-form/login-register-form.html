<div class="register-card">
  <!-- Header -->
  <div class="register-card__header">
    <div class="register-card__logo">
      <span class="material-symbols-outlined">person_add</span>
    </div>
    <h2 class="register-card__title">Criar Conta</h2>
    <p class="register-card__subtitle">Comece sua jornada financeira</p>
  </div>

  <!-- Form -->
  <form class="register-form"
    [formGroup]="registerForm"
    (ngSubmit)="register()">
    <app-input-field fieldId="nickname"
      label="Nome / Apelido"
      placeholder="Seu nome ou apelido"
      type="text"
      icon="badge"
      [error]="getErrorMessage('nickname')"></app-input-field>

    <app-input-field fieldId="email"
      label="Email"
      placeholder="nome@exemplo.com"
      type="email"
      icon="mail"
      [error]="getErrorMessage('email')"></app-input-field>

    <app-input-field fieldId="password"
      label="Senha"
      placeholder="••••••••"
      [type]="password.type()"
      icon="lock"
      [buttonIcon]="password.icon()"
      (buttonClick)="password.toggle()"
      [error]="getErrorMessage('password')"></app-input-field>

    <app-input-field fieldId="confirmPassword"
      label="Confirmar Senha"
      placeholder="••••••••"
      [type]="confirmPassword.type()"
      icon="lock"
      [buttonIcon]="confirmPassword.icon()"
      (buttonClick)="confirmPassword.toggle()"
      [error]="getErrorMessage('confirmPassword')"></app-input-field>

    <button class="register-form__submit"
      type="submit">
      <span>Criar Conta</span>
      <span class="material-symbols-outlined">arrow_forward</span>
    </button>
  </form>

  <!-- Back to login -->
  <div class="register-divider">
    <div class="register-divider__line-container">
      <div class="register-divider__line"></div>
      <span class="register-divider__text">Ou</span>
    </div>
    <p class="register-divider__login">
      Já possui uma conta?
      <a href="#"
        (click)="goBack(); $event.preventDefault()">Fazer Login</a>
    </p>
  </div>
</div>

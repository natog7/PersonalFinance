<div class="register-card">
  <!-- Header -->
  <div class="register-card__header">
    <div class="register-card__logo">
      <span class="material-symbols-outlined">person_add</span>
    </div>
    <h2 class="register-card__title">Criar Conta</h2>
    <p class="register-card__subtitle">Comece sua jornada financeira</p>
  </div>

  <!-- Form -->
  <form class="register-form" [formGroup]="registerForm" (ngSubmit)="register()">
    <div class="register-form__group">
      <label class="register-form__label" for="reg-nickname">Nome / Apelido</label>
      <div class="register-form__input-wrapper">
        <span class="material-symbols-outlined">badge</span>
        <input class="register-form__input" id="reg-nickname" placeholder="Seu nome ou apelido" type="text"
          formControlName="nickname" />
      </div>
    </div>

    <div class="register-form__group">
      <label class="register-form__label" for="reg-email">E-mail</label>
      <div class="register-form__input-wrapper">
        <span class="material-symbols-outlined">mail</span>
        <input class="register-form__input" id="reg-email" placeholder="nome@exemplo.com.br" type="email"
          formControlName="email" />
      </div>
    </div>

    <div class="register-form__group">
      <label class="register-form__label" for="reg-password">Senha</label>
      <div class="register-form__input-wrapper">
        <span class="material-symbols-outlined">lock</span>
        <input class="register-form__input register-form__input--password" id="reg-password" placeholder="••••••••"
          [type]="passwordVisible ? 'text' : 'password'" formControlName="password" />
        <button type="button" (click)="togglePasswordVisibility()">
          <span class="material-symbols-outlined">{{ passwordVisible ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <div class="register-form__group">
      <label class="register-form__label" for="reg-confirm-password">Confirmar Senha</label>
      <div class="register-form__input-wrapper">
        <span class="material-symbols-outlined">lock_reset</span>
        <input class="register-form__input register-form__input--password" id="reg-confirm-password"
          placeholder="••••••••" [type]="confirmPasswordVisible ? 'text' : 'password'"
          formControlName="confirmPassword" />
        <button type="button" (click)="toggleConfirmPasswordVisibility()">
          <span class="material-symbols-outlined">{{ confirmPasswordVisible ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <button class="register-form__submit" type="submit">
      <span>Criar Conta</span>
      <span class="material-symbols-outlined">arrow_forward</span>
    </button>
  </form>

  <!-- Back to login -->
  <div class="register-divider">
    <div class="register-divider__line-container">
      <div class="register-divider__line"></div>
      <span class="register-divider__text">Ou</span>
    </div>
    <p class="register-divider__login">
      Já possui uma conta?
      <a href="#" (click)="goBack(); $event.preventDefault()">Fazer Login</a>
    </p>
  </div>
</div>

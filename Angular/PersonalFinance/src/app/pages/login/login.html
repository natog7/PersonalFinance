<div class="login-wrapper">
  <!-- Background Architectural Elements -->
  <div class="login-bg-shapes">
    <div class="shape shape--primary"></div>
    <div class="shape shape--secondary"></div>
    <div class="pattern"></div>
  </div>

  <!-- Main Login Container -->
  <main class="login-container">
    <div class="login-grid">
      <!-- Branding/Editorial Column -->
      <div class="login-brand">
        <div class="login-brand__text">
          <span class="login-brand__subtitle">Tenha controle dos seus gastos</span>
          <h1 class="login-brand__title">
            <span class="text-primary">Personal Finance</span>
          </h1>
          <p class="login-brand__desc">
            Combinamos projeções financeiras com simplicidade para o controle da sua
            liberdade financeira.
          </p>
        </div>

        <div class="security-badge">
          <div class="security-badge__icon">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
          </div>
          <div>
            <div class="security-badge__title">Conexão Criptografada</div>
            <div class="security-badge__desc">Sua privacidade é nosso ativo mais valioso.</div>
          </div>
        </div>
      </div>

      <!-- Card Wrapper with flip animation -->
      <div class="login-card-wrapper">
        <div class="login-card-scene" [class.login-card-scene--flipped]="showRegister()">

          <!-- Front: Login Card -->
          <div class="login-card-face login-card-face--front">
            <app-login-card (openRegister)="openRegister()" />
          </div>

          <!-- Back: Register Card -->
          <div class="login-card-face login-card-face--back">
            <app-login-register-form (backToLogin)="closeRegister()" />
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Footer Links -->
  <footer class="login-footer">
    <div class="login-footer__links">
      <a href="#">Termos de Uso</a>
      <a href="#">Privacidade</a>
    </div>
    <div class="login-footer__status">
      <span class="status-dot"></span>
      <span>Sistemas Operantes</span>
    </div>
  </footer>
</div>

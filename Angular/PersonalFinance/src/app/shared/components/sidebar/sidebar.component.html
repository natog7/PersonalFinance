<aside class="sidebar">
  <!-- Brand -->
  <div class="sidebar__brand">
    <h1 class="sidebar__logo">Equilibrium</h1>
  </div>

  <!-- Navigation -->
  <nav class="sidebar__nav">
    @for (item of navItems; track item.route) {
    <a class="sidebar__nav-item" [routerLink]="item.route" routerLinkActive="sidebar__nav-item--active"
      [routerLinkActiveOptions]="{ exact: true }" ion-ripple-effect>
      <span class="material-symbols-outlined sidebar__nav-icon">{{ item.icon }}</span>
      <span>{{ item.label }}</span>
    </a>
    }
  </nav>

  <!-- Footer Actions -->
  <div class="sidebar__footer">
    <button class="sidebar__invest-btn" (click)="onInvest()">
      <span class="material-symbols-outlined">add_circle</span>
      Investir Agora
    </button>

    <button class="sidebar__logout-btn" (click)="onLogout()">
      <span class="material-symbols-outlined">logout</span>
      Sair
    </button>
  </div>
</aside>

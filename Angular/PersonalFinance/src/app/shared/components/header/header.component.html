<header class="top-bar">
  <!-- Left: menu toggle + title + balance toggle -->
  <div class="top-bar__left">
    <button class="top-bar__menu-btn" (click)="toggleMenu()"
      [attr.aria-label]="sidebarState.isOpen() ? 'Fechar menu' : 'Abrir menu'">
      <span class="material-symbols-outlined">
        {{ sidebarState.isOpen() ? 'menu_open' : 'menu' }}
      </span>
    </button>

    <div class="vertical-divider"></div>

    <span class="top-bar__section-label">{{ pageTitle() }}</span>
  </div>

  <!-- Right: search + actions + avatar -->
  <div class="top-bar__right">
    <!-- Search -->
    <!-- <div class="top-bar__search">
      <span class="material-symbols-outlined top-bar__search-icon">search</span>
      <input id="header-search" class="top-bar__search-input" type="text" placeholder="Procurar..."
        (input)="onSearch($event)" />
    </div> -->

    <!-- Icon Buttons -->
    <div class="top-bar__actions">
      <button class="top-bar__icon-btn" [attr.aria-label]="themeService.isDark() ? 'Modo Claro' : 'Modo Escuro'"
        (click)="themeService.toggleTheme()">
        <span class="material-symbols-outlined">{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</span>
      </button>
      <button class="top-bar__icon-btn" aria-label="Conta" (click)="toggleAccountMenu()">
        <span class="material-symbols-outlined">account_circle</span>
      </button>

      <!-- Account Menu Dropdown -->
      <app-account-menu [isOpen]="isAccountMenuOpen()" (settings)="navigateToSettings()"
        (logout)="isAccountMenuOpen.set(false)">
      </app-account-menu>
    </div>
  </div>
</header>
